name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', symfony: '6.4.*' }
          - { php: '8.4', symfony: '6.4.*' }
          - { php: '8.2', symfony: '7.4.*' }
          - { php: '8.4', symfony: '7.4.*' }
          - { php: '8.4', symfony: '8.*' }
          - { php: '8.5', symfony: '8.*' }
    steps:
      # Actions are pinned to commits: a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, gd, json, mbstring
          ini-values: error_reporting=-1, memory_limit=512M
          coverage: none
          tools: composer:v2, flex

      - run: composer validate --strict
      # Flex pins every symfony/* package to the version of the matrix.
      - run: composer update --no-interaction --no-progress --prefer-dist
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
      - run: vendor/bin/phpunit

  analyse:
    name: PHPStan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: curl, gd, json, mbstring
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer analyse -- --no-progress
